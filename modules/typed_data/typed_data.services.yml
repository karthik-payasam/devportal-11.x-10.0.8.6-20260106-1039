services:
  plugin.manager.typed_data_filter:
    class: Drupal\typed_data\DataFilterManager
    parent: default_plugin_manager
  Drupal\typed_data\DataFilterManagerInterface: '@plugin.manager.typed_data_filter'

  plugin.manager.typed_data_form_widget:
    class: Drupal\typed_data\Widget\FormWidgetManager
    parent: default_plugin_manager
  Drupal\typed_data\FormWidgetManagerInterface: '@plugin.manager.typed_data_form_widget'

  typed_data.data_fetcher:
    class: Drupal\typed_data\DataFetcher
    autowire: true
  Drupal\typed_data\DataFetcherInterface: '@typed_data.data_fetcher'

  typed_data.placeholder_resolver:
    class: Drupal\typed_data\PlaceholderResolver
    autowire: true
  Drupal\typed_data\PlaceholderResolverInterface: '@typed_data.placeholder_resolver'
