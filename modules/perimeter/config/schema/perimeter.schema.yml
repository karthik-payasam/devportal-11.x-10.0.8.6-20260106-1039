perimeter.settings:
  type: config_object
  label: 'Perimeter Settings'
  mapping:
    not_found_exception_patterns:
      type: sequence
      label: 'A list of regex patterns'
      sequence:
        type: string
        label: 'A regex pattern'
    whitelisted_ips:
      type: sequence
      label: 'A list of IPs that are always allowed'
      sequence:
        type: string
        label: 'An IP address'
    flood_threshold:
      type: integer
      label: 'Flood threshold'
    flood_window:
      type: integer
      label: 'Flood window'
